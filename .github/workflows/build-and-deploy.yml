name: Build, Push, and Deploy Web UI
on:
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: meta
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "env_name=production"        >> "$GITHUB_OUTPUT"
            echo "env_file=.env.prod"         >> "$GITHUB_OUTPUT"
            echo "project=agri360-prod"       >> "$GITHUB_OUTPUT"
            echo "container=agri360-prod"     >> "$GITHUB_OUTPUT"
            echo "host_port=8080"             >> "$GITHUB_OUTPUT"
          else
            echo "env_name=stage"             >> "$GITHUB_OUTPUT"
            echo "env_file=.env.stage"        >> "$GITHUB_OUTPUT"
            echo "project=agri360-stage"      >> "$GITHUB_OUTPUT"
            echo "container=agri360-stage"    >> "$GITHUB_OUTPUT"
            echo "host_port=8081"             >> "$GITHUB_OUTPUT"
          fi

      - name: Verify env file exists
        run: |
          ENV_FILE="${{ steps.meta.outputs.env_file }}"
          if [ ! -f "${ENV_FILE}" ]; then
            echo "::error title=Missing env file::${ENV_FILE} was not found."
            exit 1
          fi
          if [ ! -s "${ENV_FILE}" ]; then
            echo "::error title=Empty env file::${ENV_FILE} is empty — VITE_ build args would be blank."
            exit 1
          fi

      - name: Build and deploy with Docker Compose
        env:
          COMPOSE_PROJECT_NAME: ${{ steps.meta.outputs.project }}
          CONTAINER_NAME: ${{ steps.meta.outputs.container }}
          IMAGE_NAME: agri360-crm
          IMAGE_TAG: ${{ steps.meta.outputs.env_name }}
          HOST_PORT: ${{ steps.meta.outputs.host_port }}
        run: |
          docker compose \
            --env-file "${{ steps.meta.outputs.env_file }}" \
            -p "${{ steps.meta.outputs.project }}" \
            up -d --build --remove-orphans
          # Reclaim disk from previous builds.
          docker image prune -f

      - name: Health check
        run: |
          PORT="${{ steps.meta.outputs.host_port }}"
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null 2>&1; then
              echo "Deploy healthy on port ${PORT}."
              exit 0
            fi
            echo "Waiting for health... (${i}/20)"
            sleep 3
          done
          echo "::error title=Health check failed::Container did not become healthy on port ${PORT}."
          docker logs "${{ steps.meta.outputs.container }}" --tail 80 || true
          exit 1
