# Agri360 CRM — local/prod container orchestration.
# Usage:
#   docker compose build --build-arg VITE_API_BASE_URL=https://api.example.com/v1
#   docker compose up -d
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.agri360.example.com/v1}
        VITE_APP_ENV: production
        VITE_ENABLE_MOCK_API: "false"
        VITE_ENABLE_DEVTOOLS: "false"
    image: agri360-crm:latest
    container_name: agri360-crm
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
