# Agri360 CRM — local/prod/stage container orchestration.
#
# Manual local use (defaults: agri360-crm on :8080, reads ./.env):
#   docker compose up -d --build
#
# Per-environment (used by the self-hosted CI workflow):
#   HOST_PORT=8081 CONTAINER_NAME=agri360-stage IMAGE_TAG=stage \
#     docker compose --env-file .env.stage -p agri360-stage up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.agri360.example.com/v1}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-30000}
        VITE_APP_NAME: ${VITE_APP_NAME:-Agri360 CRM}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_ENABLE_DEVTOOLS: ${VITE_ENABLE_DEVTOOLS:-false}
        VITE_ENABLE_MOCK_API: "false"
        VITE_AUTH_STORAGE_KEY: ${VITE_AUTH_STORAGE_KEY:-agri360.auth}
    image: ${IMAGE_NAME:-agri360-crm}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-agri360-crm}
    ports:
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
